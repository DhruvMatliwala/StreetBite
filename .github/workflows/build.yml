name: Build & Verify StreetBite APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, Test & Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          FLUTTER_SDK="${FLUTTER_ROOT:-$(dirname "$(dirname "$(which flutter)")")}"
          echo "flutter.sdk=$FLUTTER_SDK" > local.properties
          gradle wrapper --gradle-version 8.9

      - name: Build Release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release

      - name: Prepare Direct Release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/StreetBite.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: streetbite-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: StreetBite v1.0.0 (Android APK)
          body: |
            Direct Android APK installer for **StreetBite**.
            - Firebase project: `streetbite-c4058`
            - Clutter-free CartoDB / OpenStreetMap map view (zero API key required)
            - Custom StreetBite adaptive app icon & Material 3 logo
          files: build/app/outputs/flutter-apk/StreetBite.apk
          prerelease: false
